services:
  ai-dev:
    build:
      context: ../../..
      dockerfile: outputs/phase0/07/Dockerfile.cpu
    volumes:
      - ../../../:/workspace
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    command: sleep infinity

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
